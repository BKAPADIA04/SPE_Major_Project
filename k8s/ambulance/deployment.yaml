apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambulance-service
  namespace: spe-system-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ambulance-service
  template:
    metadata:
      labels:
        app: ambulance-service
      annotations:
        co.elastic.logs/enabled: "true"
    spec:
      containers:
        - name: ambulance-service
          image: bkapadia04/ambulance-service:local
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          resources:
            requests:
              cpu: "200m"
      
