apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emergency-hpa
  namespace: spe-system-1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: emergency-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
