input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # Parse JSON logs (Kubernetes container logs)
  if [message] =~ "^{.*}$" {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Add Kubernetes metadata if Filebeat sends it
  if [kubernetes] {
    mutate {
      add_field => {
        "pod_name"        => "%{[kubernetes][pod][name]}"
        "namespace"       => "%{[kubernetes][namespace]}"
        "container_name"  => "%{[kubernetes][container][name]}"
      }
    }
  }

  # Normalize timestamp if Filebeat didn't do it
  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
    ignore_failure => true
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "k8s-logs-%{+YYYY.MM.dd}"
  }

  # Useful for debugging
  stdout { codec => rubydebug }
}